- name: error handling
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check user exists or not
    ansible.builtin.command: id vacchu
    register: user_output
    ignore_errors: true

  - name: print the user_output
    ansible.builtin.debug:
     msg: "{{ user_output}}"  

  - name: create user
    ansible.builtin.command: useradd vacchu
    when: user_output.rc != 0